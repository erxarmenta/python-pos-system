[project]
name = "python-pos-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ernesto Armenta", email = "ernesto.armenta.115@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
python-pos-system = "python_pos_system:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
